name: hatlyai
description: "A professional multi-app delivery project using Clean Architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter 
    
  # الموقع والخرائط
  geolocator: ^13.0.0
  google_maps_flutter: ^2.11.0  
  
  # إدارة الحالة وحقن الاعتماديات
  flutter_bloc: ^8.1.6
  get_it: ^8.0.3
  equatable: ^2.0.5
  dartz: ^0.10.1
  
  # الشبكات وقاعدة البيانات المحلية
  dio: ^5.7.0
  shared_preferences: ^2.3.5
  
  # تحسين الواجهات وتجربة المستخدم
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  blur: ^3.1.0
  
  # --- إضافات مقترحة لتعزيز الاحترافية والدقة ---
  # لتتبع حالة شبكة الإنترنت فورياً أثناء تنقل السائق
  connectivity_plus: ^6.1.0
  # لإدارة البيئات المختلفة (تطوير، إنتاج) وإخفاء مفاتيح الخرائط والـ API
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^9.1.5
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
